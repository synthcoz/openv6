<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openv6 Pro — Thank you</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('ov6_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }</script>
<link rel="stylesheet" href="../assets/site.css">
<style>
[hidden] { display: none !important; }
.ty { max-width: 760px; padding-top: 56px; padding-bottom: 72px; }
.ty-hero { text-align: center; }
.ty-ok { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 20px; background: var(--ok-soft); color: var(--ok); box-shadow: 0 0 0 8px color-mix(in srgb, var(--ok-soft) 50%, transparent); }
.ty-ok svg { width: 30px; height: 30px; }
.ty h1 { font-size: clamp(30px, 5vw, 44px); margin: 24px auto 12px; }
.ty .lead { font-size: 18px; }
.tsteps { list-style: none; padding: 0; margin: 40px 0 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; counter-reset: s; }
.tstep { position: relative; min-width: 0; padding: 24px 24px 24px 76px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); }
.tstep::before { counter-increment: s; content: counter(s); position: absolute; left: 24px; top: 24px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--primary); color: var(--primary-text); font-weight: 700; font-size: 15px; }
.tstep h2 { font-size: 19px; letter-spacing: -.02em; margin: 3px 0 6px; }
.tstep p { margin: 0; color: var(--muted); font-size: 15px; }
.tstep p b { color: var(--text-2); font-weight: 600; }
.tstep .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; align-items: center; }
.tstep .cmd { margin-top: 12px; }
.tstep .oses { font-size: 13.5px; color: var(--muted); }
.tstep .oses a { color: var(--text); text-underline-offset: 3px; text-decoration-color: var(--border-2); cursor: pointer; }
.tstep .tip { margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--soft); font-size: 14px; color: var(--text-2); }
.ty-help { text-align: center; color: var(--muted); font-size: 14.5px; margin-top: 36px; }
.ty-help a { color: var(--text); text-underline-offset: 3px; }
@media (max-width: 520px) {
  .ty { padding-top: 36px; }
  .tstep { padding: 20px; }
  .tstep::before { position: static; margin-bottom: 12px; }
  .tstep .acts .btn { width: 100%; }
}
</style>
</head>
<body>
<header id="hdr"><div class="wrap"><div class="nav">
  <a class="brand" href="../"><img src="../assets/logo.svg" alt="" width="30" height="30">openv6</a>
  <div class="sp"></div>
  <div class="seg" id="lang"><button data-l="en">EN</button><button data-l="vi">VI</button></div>
  <button class="icon-btn" id="theme" type="button" data-t="theme_toggle"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</div></div></header>

<main class="wrap ty">
  <div class="ty-hero">
    <span class="ty-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <h1 data-i="h1"></h1>
    <p class="lead" data-i="lead"></p>
  </div>

  <ol class="tsteps">
    <li class="tstep">
      <h2 data-i="k_h"></h2>
      <p data-h="k_p"></p>
      <div class="acts"><a class="btn" href="https://polar.sh/thephuc/portal" target="_blank" rel="noopener"><span data-i="k_portal"></span> ↗</a></div>
    </li>
    <li class="tstep">
      <h2 data-i="d_h"></h2>
      <p data-i="d_p"></p>
      <div class="acts">
        <a class="btn primary" id="dlBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span id="dlLabel"></span></a>
        <span class="oses"><span data-i="d_other"></span> <a data-os="windows">Windows</a> · <a data-os="macos">macOS</a> · <a data-os="linux">Linux</a></span>
      </div>
      <div class="cmd" id="cmdBox"><code id="cmd"></code><button type="button" class="cp" data-i="copy"></button></div>
      <p class="tip" id="osTip" hidden></p>
    </li>
    <li class="tstep">
      <h2 data-i="a_h"></h2>
      <p data-h="a_p"></p>
      <div class="acts"><a class="btn" href="http://127.0.0.1:8080/#settings" target="_blank" rel="noopener"><span data-i="a_open"></span> ↗</a></div>
      <p class="tip" data-h="a_tip"></p>
    </li>
  </ol>

  <p class="ty-help"><span data-i="help"></span> <a href="https://github.com/thephux/openv6-releases/issues" target="_blank" rel="noopener" data-i="help_link"></a></p>
</main>

<script>
const T = {
  vi: {
    h1: 'Cảm ơn bạn đã mua openv6 Pro!', lead: 'Thanh toán đã xong. Còn 3 bước nữa là mở khoá Pro.',
    theme_toggle: 'Đổi giao diện sáng / tối', copy: 'Sao chép', copied: 'Đã chép ✓',
    k_h: 'Lấy license key',
    k_p: 'Polar đã gửi key tới <b>email bạn dùng khi thanh toán</b> (xem cả mục Spam / Quảng cáo). Key cũng luôn có trong cổng khách hàng Polar: đăng nhập bằng email đó, không cần mật khẩu.',
    k_portal: 'Mở cổng khách hàng Polar',
    d_h: 'Tải và cài openv6', d_p: 'Đã cài bản Free rồi? Bỏ qua bước này, không cần cài lại.',
    d_for: 'Tải cho {os}', d_any: 'Chọn hệ điều hành', d_other: 'Máy khác:',
    tip_windows: 'Nếu Windows hiện “Windows protected your PC”: bấm More info → Run anyway. Lệnh trên chạy trong PowerShell (Admin).',
    tip_macos: 'Nếu macOS chặn vì “không xác minh được nhà phát triển”: Cài đặt hệ thống → Quyền riêng tư & Bảo mật → Vẫn mở. Hoặc dùng lệnh trên trong Terminal.',
    tip_linux: 'Ubuntu, Debian, Zorin (amd64, arm64, armhf): chạy lệnh trên trong Terminal.',
    a_h: 'Kích hoạt Pro',
    a_p: 'Mở dashboard (icon openv6 ở khay hệ thống, hoặc <b>http://127.0.0.1:8080</b>) → <b>Cài đặt → Bản quyền</b>, dán key rồi bấm <b>Kích hoạt</b>.',
    a_open: 'Mở dashboard trên máy này',
    a_tip: '<b>Gói 3 máy:</b> nhập cùng một key trên từng máy chạy dashboard. <b>Đổi máy:</b> bấm <i>Huỷ kích hoạt</i> trên máy cũ trước.',
    help: 'Cần giúp hoặc chưa nhận được key?', help_link: 'Gửi câu hỏi cho chúng tôi',
  },
  en: {
    h1: 'Thanks for buying openv6 Pro!', lead: 'Your payment went through. Three steps to unlock Pro.',
    theme_toggle: 'Switch light / dark', copy: 'Copy', copied: 'Copied ✓',
    k_h: 'Get your license key',
    k_p: 'Polar sent the key to <b>the e-mail you used at checkout</b> (check Spam / Promotions too). It is also always in the Polar customer portal: sign in with that e-mail, no password needed.',
    k_portal: 'Open the Polar customer portal',
    d_h: 'Download and install openv6', d_p: 'Already running the Free version? Skip this step, no reinstall needed.',
    d_for: 'Download for {os}', d_any: 'Choose your system', d_other: 'Other systems:',
    tip_windows: 'If Windows shows “Windows protected your PC”, click More info → Run anyway. The command above runs in PowerShell (Admin).',
    tip_macos: 'If macOS says it can’t verify the developer: System Settings → Privacy & Security → Open Anyway. Or use the command above in Terminal.',
    tip_linux: 'Ubuntu, Debian, Zorin (amd64, arm64, armhf): run the command above in Terminal.',
    a_h: 'Activate Pro',
    a_p: 'Open the dashboard (the openv6 tray icon, or <b>http://127.0.0.1:8080</b>) → <b>Settings → License</b>, paste the key and click <b>Activate</b>.',
    a_open: 'Open the dashboard on this computer',
    a_tip: '<b>3-machine plan:</b> enter the same key on each dashboard machine. <b>Changing computers:</b> click <i>Deactivate</i> on the old one first.',
    help: 'Need help, or no key yet?', help_link: 'Ask us a question',
  },
};
const OS_NAME = { windows: 'Windows', macos: 'macOS', linux: 'Linux' };
const FILE = { windows: 'download/windows', macos: 'download/macos' };
const SH = 'curl -fsSL https://raw.githubusercontent.com/thephux/openv6-releases/main/install.sh | sudo bash';
const CMD = { windows: 'irm https://raw.githubusercontent.com/thephux/openv6-releases/main/install.ps1 | iex', macos: SH, linux: SH };
const detected = (() => {
  const ua = navigator.userAgent;
  if (/Android|iPhone|iPad|iPod|CrOS|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return '';
  if (/Windows NT/.test(ua)) return 'windows';
  if (/Macintosh|Mac OS X/.test(ua)) return 'macos';
  if (/Linux|X11/.test(ua)) return 'linux';
  return '';
})();
let os = detected || 'windows';
let lang = 'en';
try { const s = localStorage.getItem('ov6_lang'); if (s === 'vi' || s === 'en') lang = s; } catch (e) { /* storage blocked */ }

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = 'openv6 Pro — ' + (lang === 'vi' ? 'Cảm ơn bạn' : 'Thank you');
  for (const el of document.querySelectorAll('[data-i]')) el.textContent = t[el.dataset.i] || '';
  for (const el of document.querySelectorAll('[data-h]')) el.innerHTML = t[el.dataset.h] || ''; // our own strings only
  for (const el of document.querySelectorAll('[data-t]')) { el.title = t[el.dataset.t]; el.setAttribute('aria-label', el.title); }
  for (const b of document.querySelectorAll('[data-l]')) b.classList.toggle('on', b.dataset.l === lang);
  const dl = document.getElementById('dlBtn');
  // ../download/<os> is a stable link to the latest installer; Linux installs with the command
  if (FILE[os]) { dl.href = '../' + FILE[os]; dl.hidden = false; } else dl.hidden = true;
  document.getElementById('dlLabel').textContent = t.d_for.replace('{os}', OS_NAME[os]);
  for (const a of document.querySelectorAll('[data-os]')) a.style.fontWeight = a.dataset.os === os ? '700' : '';
  document.getElementById('cmd').textContent = CMD[os];
  const tip = document.getElementById('osTip'); tip.textContent = t['tip_' + os]; tip.hidden = false;
}
for (const b of document.querySelectorAll('[data-l]')) b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('ov6_lang', lang); } catch (e) { /* ignore */ } render(); };
for (const a of document.querySelectorAll('[data-os]')) a.onclick = () => { os = a.dataset.os; render(); };
document.querySelector('.cmd .cp').onclick = async (e) => {
  try { await navigator.clipboard.writeText(document.getElementById('cmd').textContent); e.target.textContent = T[lang].copied; setTimeout(() => { e.target.textContent = T[lang].copy; }, 1400); } catch (err) { /* clipboard blocked */ }
};
document.getElementById('theme').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try { localStorage.setItem('ov6_theme', t); } catch (e) { /* ignore */ }
};
const hdr = document.getElementById('hdr');
addEventListener('scroll', () => hdr.classList.toggle('scrolled', scrollY > 8), { passive: true });
render();
</script>
</body>
</html>

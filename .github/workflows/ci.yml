name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: node --check web/app.js && node --check web/i18n.js
      - name: VPN bypass routing on a real kernel (isolated network namespace)
        run: ./scripts/netns-test.sh
      - name: Cross-compile every platform
        run: |
          for p in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/amd64 darwin/arm64; do
            echo "== $p"; GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Unit tests + real IPv6 address on a network adapter (runner is Administrator)
        env:
          OPENV6_SYSTEM_TEST: "1"
        run: go test -v ./internal/netcfg ./internal/proxy ./internal/update ./internal/panel ./internal/icon
      - name: Service install / uninstall
        shell: pwsh
        run: |
          go build -o openv6.exe .
          .\openv6.exe install server
          Start-Sleep -Seconds 5
          Get-Service openv6 | Format-List Name,Status,StartType
          if ((Get-Service openv6).Status -ne 'Running') { Get-Content "$env:ProgramData\openv6\openv6.log" -ErrorAction SilentlyContinue; exit 1 }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/status
          Write-Host $r.Content
          Get-Content "$env:ProgramData\openv6\tray.json"
          .\openv6.exe uninstall
          if (Get-Service openv6 -ErrorAction SilentlyContinue) { exit 1 }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Real IPv6 alias on an interface (root)
        run: |
          go test -c -o netcfg.test ./internal/netcfg
          sudo OPENV6_SYSTEM_TEST=1 ./netcfg.test -test.run TestRealAddressLifecycle -test.v
      - name: Service install / uninstall (launchd)
        run: |
          CGO_ENABLED=1 go build -o openv6 .
          sudo ./openv6 install server
          sleep 5
          curl -fsS http://127.0.0.1:8080/api/status
          sudo ./openv6 uninstall

name: ci
# GitHub Actions minutes are limited on a private repository, and macOS runners
# count 10x, Windows 2x. Pull requests and pushes run only the Linux job (unit
# tests, a real-kernel network test, cross-compiling every platform). The
# Windows, macOS and installer jobs run for release tags and on demand
# (Actions → ci → Run workflow).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["site/**", "blog/**", "docs/**", "deploy/**", "*.md", "wrangler.jsonc", "build.sh"]
  pull_request:
    paths-ignore: ["site/**", "blog/**", "docs/**", "deploy/**", "*.md", "wrangler.jsonc", "build.sh"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: node --check web/app.js && node --check web/i18n.js && node --check web/icons.js
      - name: VPN bypass routing on a real kernel (isolated network namespace)
        run: ./scripts/netns-test.sh
      - name: Cross-compile every platform
        run: |
          for p in linux/amd64 linux/arm64 linux/arm windows/amd64 darwin/amd64 darwin/arm64; do
            echo "== $p"; GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -o /dev/null . || exit 1
          done

  windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Unit tests + real IPv6 address on a network adapter (runner is Administrator)
        env:
          OPENV6_SYSTEM_TEST: "1"
        run: go test -v ./internal/netcfg ./internal/proxy ./internal/update ./internal/panel ./internal/icon
      - name: Service install / uninstall (GUI build, like the installer)
        shell: pwsh
        run: |
          go build -ldflags "-H windowsgui" -o openv6.exe .
          $p = Start-Process -Wait -PassThru -FilePath .\openv6.exe -ArgumentList 'install','server'
          if ($p.ExitCode -ne 0) { exit 1 }
          Start-Sleep -Seconds 5
          Get-Service openv6 | Format-List Name,Status,StartType
          if ((Get-Service openv6).Status -ne 'Running') { Get-Content "$env:ProgramData\openv6\shared\openv6.log" -ErrorAction SilentlyContinue; exit 1 }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/status
          Write-Host $r.Content
          $info = Get-Content "$env:ProgramData\openv6\shared\tray.json" | ConvertFrom-Json
          $h = @{ 'X-Tray-Token' = $info.token }
          (Invoke-WebRequest -UseBasicParsing -Headers $h "$($info.url)/api/tray/status").Content
          icacls "$env:ProgramData\openv6"
          icacls "$env:ProgramData\openv6\shared"
          # data folder (tokens, passwords) must not be readable by normal users
          if ((icacls "$env:ProgramData\openv6" | Out-String) -match 'BUILTIN\\Users|Authenticated Users|Everyone') { Write-Host "data folder readable by users"; exit 1 }
          if (-not ((icacls "$env:ProgramData\openv6\shared" | Out-String) -match 'BUILTIN\\Users')) { Write-Host "shared folder not readable by users"; exit 1 }
          # port fallback: occupy 8080, restart, the dashboard must move to 8081
          $p = Start-Process -Wait -PassThru -FilePath .\openv6.exe -ArgumentList 'uninstall'
          $busy = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 8080); $busy.Start()
          $p = Start-Process -Wait -PassThru -FilePath .\openv6.exe -ArgumentList 'install','server'
          Start-Sleep -Seconds 6
          $info = Get-Content "$env:ProgramData\openv6\shared\tray.json" | ConvertFrom-Json
          Write-Host "dashboard url with 8080 busy: $($info.url)"
          if ($info.url -notlike '*:8081') { Get-Content "$env:ProgramData\openv6\shared\openv6.log"; exit 1 }
          (Invoke-WebRequest -UseBasicParsing "$($info.url)/api/status").Content
          $busy.Stop()
          $p = Start-Process -Wait -PassThru -FilePath .\openv6.exe -ArgumentList 'uninstall'
          if (Get-Service openv6 -ErrorAction SilentlyContinue) { exit 1 }

  macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Real IPv6 alias on an interface (root)
        run: |
          go test -c -o netcfg.test ./internal/netcfg
          sudo OPENV6_SYSTEM_TEST=1 ./netcfg.test -test.run TestRealAddressLifecycle -test.v
      - name: Service install / uninstall (launchd)
        run: |
          CGO_ENABLED=1 go build -o openv6 .
          sudo ./openv6 install server
          sleep 5
          curl -fsS http://127.0.0.1:8080/api/status
          sudo ./openv6 uninstall

  # The one-line installers, end to end, against the latest published release.
  install-scripts:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: install.sh (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          sudo bash install.sh
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/status && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/status
          sudo /usr/local/bin/openv6 uninstall
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: powershell # Windows PowerShell 5.1, what most users have
        run: |
          Get-Content -Raw .\install.ps1 | Invoke-Expression
          Start-Sleep -Seconds 5
          if ((Get-Service openv6).Status -ne 'Running') { exit 1 }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/api/status).Content
          Start-Process -Wait -FilePath "$env:ProgramFiles\openv6\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES'
          if (Get-Service openv6 -ErrorAction SilentlyContinue) { exit 1 }

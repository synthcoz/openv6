name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: node --check web/app.js && node --check web/i18n.js
      - name: VPN bypass routing on a real kernel (isolated network namespace)
        run: ./scripts/netns-test.sh

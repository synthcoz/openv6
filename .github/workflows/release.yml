name: release
# Builds every platform and publishes a GitHub Release when main contains a
# version (internal/proto/proto.go) that has no release yet, or a v* tag is pushed.
# Runs only when there may be something to publish: a v* tag, a version bump on
# main, or by hand (it no longer builds every installer on every pull request,
# which used up the Actions minutes).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["internal/proto/proto.go", ".github/workflows/release.yml", "packaging/**"]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Installers and updates are published to a separate public repository, so
  # this source repository can stay private. RELEASES_TOKEN: fine-grained
  # token with Contents read/write on that repository only.
  RELEASES_REPO: thephux/openv6-releases
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' internal/proto/proto.go | tr -d '"')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: plan
    if: needs.plan.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: make dist
      - name: .deb packages
        run: |
          cd dist
          for a in amd64 arm64 arm; do ../packaging/linux/build-deb.sh "${{ needs.plan.outputs.tag }}" $a openv6-linux-$a; done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/openv6-linux-*
            dist/*.deb

  windows:
    needs: plan
    if: needs.plan.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          go run ./tools/mkicons -png openv6.png -ico packaging/windows/openv6.ico
          # embed the icon into the executables (best effort)
          go run github.com/tc-hib/go-winres@v0.3.3 simply --icon openv6.png --manifest gui || echo "icon embedding skipped"
          # GUI build: never opens a console window (CLI output attaches to the terminal)
          CGO_ENABLED=0 go build -ldflags "-s -w -H windowsgui" -o packaging/windows/openv6.exe .
      - name: Code signing setup (optional)
        id: sign
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # Signing removes the SmartScreen "Unknown publisher" warning. It runs
          # only when the WINDOWS_CERT_PFX (base64 .pfx) secret is set.
          if (-not $env:CERT_PFX) { Write-Host "no code-signing certificate configured: building unsigned"; "enabled=false" >> $env:GITHUB_OUTPUT; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like '*x64*' } | Select-Object -Last 1
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT
          "enabled=true" >> $env:GITHUB_OUTPUT
      - name: Sign openv6.exe
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & "${{ steps.sign.outputs.signtool }}" sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d openv6 packaging\windows\openv6.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          cp packaging/windows/openv6.exe dist/openv6-windows-amd64.exe
      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          OPENV6_VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc packaging\windows\openv6.iss
          Copy-Item packaging\windows\openv6-setup-windows-amd64.exe dist\
      - name: Sign installer
        if: steps.sign.outputs.enabled == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          & "${{ steps.sign.outputs.signtool }}" sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "openv6 setup" dist\openv6-setup-windows-amd64.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: plan
    if: needs.plan.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build (cgo for the tray)
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o dist/openv6-darwin-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o dist/openv6-darwin-amd64 .
          lipo -create -output openv6-universal dist/openv6-darwin-arm64 dist/openv6-darwin-amd64
      - name: Package (.pkg)
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp openv6-universal pkgroot/usr/local/bin/openv6
          V="${{ needs.plan.outputs.tag }}"
          pkgbuild --root pkgroot --scripts packaging/macos/scripts --identifier com.openv6.pkg \
            --version "${V#v}" --install-location / dist/openv6-macos.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    needs: [plan, linux, windows, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sign checksums
        env:
          OPENV6_SIGNING_KEY: ${{ secrets.OPENV6_SIGNING_KEY }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          (cd out && { echo "# openv6 $TAG"; sha256sum *; } > ../SHA256SUMS && mv ../SHA256SUMS SHA256SUMS && cat SHA256SUMS)
          if [ -n "$OPENV6_SIGNING_KEY" ]; then
            go run ./tools/sign out
          else
            echo "::warning::OPENV6_SIGNING_KEY is not set: this release is unsigned and in-app updates will refuse it"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASES_TOKEN is not set (token with Contents write on $RELEASES_REPO)"; exit 1; fi
          ls -la out
          cat > notes.md <<'EOF'
          **Windows 10/11:** in PowerShell
          ```powershell
          irm https://raw.githubusercontent.com/thephux/openv6-releases/main/install.ps1 | iex
          ```
          or download `openv6-setup-windows-amd64.exe`, run it and click Next. If Windows shows "Unknown publisher", choose *More info → Run anyway*.

          **macOS and Ubuntu / Debian / Zorin:** in Terminal
          ```bash
          curl -fsSL https://raw.githubusercontent.com/thephux/openv6-releases/main/install.sh | sudo bash
          ```
          or download `openv6-macos.pkg` (macOS) or the `.deb` (`sudo apt install ./openv6_*.deb`).

          Website: https://thephuc.xyz/openv6/
          EOF
          gh release create "$TAG" out/* --repo "$RELEASES_REPO" --title "$TAG" --notes-file notes.md
          # keep the one-line installers in the public repository in sync
          for f in install.sh install.ps1; do
            SHA=$(gh api "repos/$RELEASES_REPO/contents/$f" --jq .sha 2>/dev/null || true)
            gh api -X PUT "repos/$RELEASES_REPO/contents/$f" -f message="$f for $TAG" \
              -f content="$(base64 -w0 $f)" ${SHA:+-f sha="$SHA"} >/dev/null
          done
